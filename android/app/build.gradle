plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gcctbc.sender'
    compileSdk 34

    defaultConfig {
        applicationId "com.gcctbc.sender"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
